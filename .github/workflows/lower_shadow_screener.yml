name: XQ 下引線選股

on:
  schedule:
    # 每天台灣 19:00（UTC 11:00）。今天沒有完整行情（週末 / 假日 / 交易所未公布）時，
    # 程式自動改用最近交易日，Discord 標題會寫明實際資料日期。
    # GitHub 排程尖峰時段常延遲 10～30 分鐘，實際推播時間會落在 19:00～19:30。
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "日期（留空 = 最新交易日）。可打 10/12、1012、2026-10-12；打到假日會自動用前一個交易日"
        required: false
        default: ""

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行選股
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python lower_shadow_screener.py

      - name: 上傳 CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lower-shadow-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 30
